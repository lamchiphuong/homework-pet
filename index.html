<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chú Ong Chăm Chỉ - Làm Bài Tập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: white;
      border-radius: 24px;
      padding: 28px 24px;
      width: 92%;
      max-width: 580px;
      max-height: 88vh;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      text-align: center;
      transform: scale(0.8);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .modal.active {
      transform: scale(1);
      opacity: 1;
    }

    .bee {
      font-size: 80px;
      margin-bottom: 16px;
      animation: wave 2.2s infinite ease-in-out;
      display: inline-block;
      transform-origin: bottom;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(14deg); }
      50% { transform: rotate(-10deg); }
      75% { transform: rotate(8deg); }
    }

    h1, h2 {
      font-family: 'Varela Round', sans-serif;
      color: #2c3e50;
      margin-bottom: 16px;
    }

    h1 { font-size: 32px; }
    h2 { font-size: 26px; }

    p {
      font-size: 17px;
      color: #5d6d7e;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #feca57;
      color: #2c3e50;
      box-shadow: 0 6px 0 #ff9f1a;
    }

    .btn-primary:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 0 #ff9f1a;
    }

    .btn-secondary {
      background: #dfe6e9;
      color: #636e72;
      box-shadow: 0 6px 0 #b2bec3;
    }

    .btn-secondary:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 0 #b2bec3;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 36px;
      color: #b2bec3;
      cursor: pointer;
      background: none;
      border: none;
    }

    .countdown {
      font-size: 60px;
      font-weight: 700;
      color: #e17055;
      margin: 20px 0;
    }

    .small-text {
      font-size: 15px;
      color: #999;
      margin-top: 16px;
    }

    /* Main screen */
    #mainScreen {
      text-align: center;
      padding: 30px 15px;
      width: 100%;
      max-width: 1000px;
    }

    #mainScreen .bee-big {
      font-size: 110px;
      margin-bottom: 20px;
      animation: wave 2.8s infinite ease-in-out;
    }

    .hidden { display: none !important; }

    .iframe-container {
      width: 100%;
      max-width: 760px;
      margin: 30px auto 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      background: white;
      min-height: 300px;
    }

    .loading-text {
      color: #e17055;
      font-weight: bold;
      font-size: 18px;
      margin: 30px 0;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @media (max-width: 600px) {
      .modal { padding: 24px 18px; }
      h1 { font-size: 28px; }
      h2 { font-size: 24px; }
      .bee, .bee-big { font-size: 80px; }
      .btn { padding: 12px 32px; font-size: 16px; }
      .iframe-container { margin-top: 20px; }
    }
  </style>
</head>
<body>

<!-- Welcome Modal -->
<div class="modal-overlay" id="welcomeModal">
  <div class="modal" id="welcomeContent">
    <button class="close-btn" id="closeWelcome">×</button>
    <div class="bee">🐝</div>
    <h2>Chào bạn!</h2>
    <p>Hãy cùng chú ong chăm chỉ này làm bài tập về nhà nhé!<br>Bạn đã sẵn sàng chưa?</p>
    
    <div class="btn-group">
      <button class="btn btn-primary" id="btnReady">Sẵn sàng ✧</button>
      <button class="btn btn-secondary" id="btnNotYet">Chưa đâu ૮₍ ˶•⤙•˶ ₎ა</button>
    </div>
  </div>
</div>

<!-- Countdown Modal -->
<div class="modal-overlay" id="countdownModal">
  <div class="modal" id="countdownContent">
    <div class="bee">🐝💨</div>
    <h2>Nhanh lên nào!</h2>
    <p>Bạn có <strong>30 giây</strong> để sẵn sàng<br>Không sẵn sàng cũng phải làm bài đấy nhé!</p>
    
    <div class="countdown" id="timer">30</div>
    
    <div class="small-text">Đang đếm ngược... ⏳</div>
  </div>
</div>

<!-- Main Screen with Google Form -->
<div id="mainScreen" class="hidden">
  <div class="bee-big">🐝✨</div>
  <h1>Chào các em!</h1>
  <p>Hãy làm bài tập để ngày càng tiến bộ nhé! 💪📚</p>
  
  <div class="iframe-container">
    <div class="loading-text"> BÀI TẬP DƯỚI ĐÂY NÈ 🐝</div>
    <iframe 
      src="https://docs.google.com/forms/d/e/1FAIpQLSf5wRzsnlVhQeA7QCES4aS_QXYwrUenhpdvD4s_lve5BKQIwg/viewform?embedded=true"
      width="100%"
      height="2000"
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      style="min-height: 400px; border: none;"
    >
      Đang tải… Nếu không thấy form, hãy thử mở bằng Live Server hoặc upload lên web nhé!
    </iframe>
  </div>
</div>

<script>
  const welcomeOverlay   = document.getElementById('welcomeModal');
  const countdownOverlay = document.getElementById('countdownModal');
  const mainScreen       = document.getElementById('mainScreen');

  const welcomeContent   = document.getElementById('welcomeContent');
  const countdownContent = document.getElementById('countdownContent');

  function showModal(overlay, content) {
    overlay.classList.add('active');
    setTimeout(() => content.classList.add('active'), 50);
  }

  function hideModal(overlay, content) {
    content.classList.remove('active');
    setTimeout(() => overlay.classList.remove('active'), 400);
  }

  function showMainScreen() {
    mainScreen.classList.remove('hidden');
  }

  // Load trang → hiện welcome
  window.addEventListener('load', () => {
    showModal(welcomeOverlay, welcomeContent);
  });

  // Đóng welcome → hiện main
  document.getElementById('closeWelcome').addEventListener('click', () => {
    hideModal(welcomeOverlay, welcomeContent);
    showMainScreen();
  });

  // Sẵn sàng → hiện main ngay
  document.getElementById('btnReady').addEventListener('click', () => {
    hideModal(welcomeOverlay, welcomeContent);
    showMainScreen();
  });

  // Chưa → countdown → rồi hiện main
  document.getElementById('btnNotYet').addEventListener('click', () => {
    hideModal(welcomeOverlay, welcomeContent);
    setTimeout(() => {
      showModal(countdownOverlay, countdownContent);
      startCountdown();
    }, 450);
  });

  function startCountdown() {
    let timeLeft = 30;
    const timerEl = document.getElementById('timer');
    
    const interval = setInterval(() => {
      timeLeft--;
      timerEl.textContent = timeLeft;

      if (timeLeft <= 10) {
        timerEl.style.color = timeLeft <= 5 ? '#d63031' : '#e67e22';
      }

      if (timeLeft <= 0) {
        clearInterval(interval);
        hideModal(countdownOverlay, countdownContent);
        showMainScreen();
      }
    }, 1000);
  }
</script>

</body>
</html>
